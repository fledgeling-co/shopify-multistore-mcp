# Publishes the marketing page in design/marketing to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
    paths: ["design/marketing/index.html", "design/marketing/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the page and its assets; copy.md and the review notes stay in the repo.
      - run: mkdir _site && cp design/marketing/index.html _site/ && cp -R design/marketing/assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
